<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>WPX Player Dashboard</title>
<script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
<style>
:root{
--bg:#0F0F19;
--panel:#141423;
--panel2:#191928;
--deep:#0A0A14;
--border:#28283C;
--text:#DCDCDC;
--muted:#B4B4C8;
--accent:#00FFB4;
--blue:#00B4FF;
--purple:#B464FF;
--gold:#FFC800;
--orange:#FF6432;
--pink:#FF3296;
}
body{margin:0;padding:24px;background:radial-gradient(circle at top,#191928 0%,#0F0F19 45%,#07070D 100%);color:var(--text);font-family:'Segoe UI',Calibri,Arial,sans-serif;}
.page{max-width:1400px;margin:0 auto;}
.header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px;padding:16px 18px;background:linear-gradient(135deg,var(--panel),var(--deep));border-bottom:2px solid var(--accent);border-radius:18px;box-shadow:0 0 24px rgba(0,255,180,.16);}
h1{margin:0;font-size:32px;letter-spacing:1px;color:var(--accent);font-weight:800;text-shadow:0 0 14px rgba(0,255,180,.55);}
.sub{color:var(--muted);font-size:14px;margin-top:4px;}
select,input{background:var(--panel2);color:var(--text);border:2px solid var(--accent);border-radius:999px;padding:10px 14px;font-size:15px;min-width:280px;font-family:'Segoe UI',Calibri,Arial,sans-serif;box-shadow:0 0 16px rgba(0,255,180,.18);outline:none;}
select:focus,input:focus{box-shadow:0 0 22px rgba(0,255,180,.45);}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px;}
.card{background:linear-gradient(180deg,var(--panel),var(--deep));border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:18px;padding:16px;box-shadow:0 16px 40px rgba(0,0,0,.35);}
.card:nth-child(2){border-top-color:var(--accent);}.card:nth-child(3){border-top-color:var(--blue);}.card:nth-child(4){border-top-color:var(--purple);}.card:nth-child(5){border-top-color:var(--gold);}.card:nth-child(6){border-top-color:var(--orange);}.card:nth-child(7){border-top-color:var(--pink);}
.label{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;}
.value{font-size:25px;font-weight:800;color:var(--accent);text-shadow:0 0 10px rgba(0,255,180,.28);}
#cardPlayer{font-family:'Informal Roman','Segoe UI',Calibri,Arial,sans-serif;font-size:30px;color:#06FFAC;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
.panel{background:var(--deep);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 16px 40px rgba(0,0,0,.35);}
.wide{grid-column:1 / -1;}
.panel h2{margin:0 0 12px 0;font-size:20px;color:var(--accent);font-family:'Segoe UI',Calibri,Arial,sans-serif;text-shadow:0 0 10px rgba(0,255,180,.3);}
.table-shell{overflow:auto;max-height:520px;background:var(--deep);border:1px solid var(--border);border-radius:18px;}
table{border-collapse:collapse;width:100%;min-width:900px;}
th,td{border-bottom:1px solid var(--border);padding:9px 10px;text-align:left;white-space:nowrap;}
th{position:sticky;top:0;background:var(--panel);color:var(--accent);z-index:2;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.5px;}
td{color:var(--text);}
tr:hover td{background:var(--panel2);color:#FFFFFF;}
.hidden{display:none;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}body{padding:14px;}h1{font-size:25px;}}
</style>
</head>
<body>
<div class='page'>
<div class='header'>
<div><h1>WARRIOR PHOENIX</h1><div class='sub'>Interactive Player Dashboard · Updated: April 29, 2026 8:41 AM</div></div>
<div><select id='playerSelect' onchange='renderDashboard()'></select></div>
</div>
<div class='cards'>
<div class='card'><div class='label'>Player</div><div class='value' id='cardPlayer'>-</div></div>
<div class='card'><div class='label'>Overall Rank</div><div class='value' id='cardRank'>-</div></div>
<div class='card'><div class='label'>Total Score</div><div class='value' id='cardTotal'>-</div></div>
<div class='card'><div class='label'>Weekly Avg</div><div class='value' id='cardAvg'>-</div></div>
<div class='card'><div class='label'>Weeks Played</div><div class='value' id='cardWeeks'>-</div></div>
<div class='card'><div class='label'>Missed Daily</div><div class='value' id='cardDailyMiss'>-</div></div>
<div class='card'><div class='label'>Missed Weekly</div><div class='value' id='cardWeeklyMiss'>-</div></div>
</div>
<div class='grid' id='chartsArea'>
<div class='panel'><h2>Weekly Score Trend</h2><canvas id='scoreChart'></canvas></div>
<div class='panel'><h2>Weekly Rank Trend</h2><canvas id='rankChart'></canvas></div>
<div class='panel wide'><h2>Selected Player Weekly History</h2><div class='table-shell'><table id='historyTable'></table></div></div>
</div>
<div class='panel' id='allPlayersPanel'>
<h2>All Players</h2>
<input id='searchBox' placeholder='Search all players...' oninput='filterAllPlayers()' style='margin-bottom:12px;'>
<div class='table-shell'><table id='allPlayersTable'></table></div>
</div>
</div>

let scoreChart = null;
let rankChart = null;
function num(value){let n=parseFloat(String(value).replace(/,/g,'').replace(/[^0-9.-]/g,''));return isNaN(n)?null:n;}
function populateDropdown(){
const sel=document.getElementById('playerSelect');
sel.innerHTML='<option value="__all__">All Players</option>';
players.forEach((p,i)=>{let opt=document.createElement('option');opt.value=i;opt.textContent=p.name;sel.appendChild(opt);});
}
function renderDashboard(){
const val=document.getElementById('playerSelect').value;
if(val==='__all__'){renderAllPlayersView();return;}
const p=players[parseInt(val)];
document.getElementById('chartsArea').classList.remove('hidden');
document.getElementById('allPlayersPanel').classList.add('hidden');
document.getElementById('cardPlayer').textContent=p.name;
document.getElementById('cardRank').textContent=p.overallRank||'-';
document.getElementById('cardTotal').textContent=p.overallTotal||'-';
document.getElementById('cardAvg').textContent=p.weeklyAverage||'-';
document.getElementById('cardDailyMiss').textContent=p.missedDaily||'-';
document.getElementById('cardWeeklyMiss').textContent=p.missedWeekly||'-';
document.getElementById('cardWeeks').textContent=p.weeks.filter(w=>num(w.total)!==null && num(w.total)>0).length;
renderHistory(p);
renderCharts(p);
}
function renderAllPlayersView(){
document.getElementById('chartsArea').classList.add('hidden');
document.getElementById('allPlayersPanel').classList.remove('hidden');
document.getElementById('cardPlayer').textContent=players.length;
document.getElementById('cardRank').textContent='-';
document.getElementById('cardTotal').textContent='-';
document.getElementById('cardAvg').textContent='-';
document.getElementById('cardWeeks').textContent='-';
document.getElementById('cardDailyMiss').textContent='-';
document.getElementById('cardWeeklyMiss').textContent='-';
renderAllPlayersTable();
}
function renderHistory(p){
let table=document.getElementById('historyTable');
table.innerHTML='<thead><tr><th>Week</th><th>Weekly Total</th><th>Weekly Rank</th></tr></thead><tbody>'+p.weeks.map(w=>`<tr><td>${w.week}</td><td>${w.total||''}</td><td>${w.rank||''}</td></tr>`).join('')+'</tbody>';
}
function renderCharts(p){
const labels=p.weeks.map(w=>w.week).reverse();
const totals=p.weeks.map(w=>num(w.total)).reverse();
const ranks=p.weeks.map(w=>num(w.rank)).reverse();
if(scoreChart)scoreChart.destroy();
if(rankChart)rankChart.destroy();
scoreChart=new Chart(document.getElementById('scoreChart'),{type:'line',data:{labels:labels,datasets:[{label:'Weekly Total',data:totals,tension:.3,borderColor:'#00FFB4',backgroundColor:'rgba(0,255,180,.18)',pointBackgroundColor:'#00FFB4',pointBorderColor:'#00FFB4'},{label:'20M Goal',data:labels.map(()=>20000000),borderColor:'#FF3296',borderDash:[6,5],pointRadius:0}]},options:{responsive:true,plugins:{legend:{labels:{color:'#DCDCDC',font:{family:'Segoe UI'}}}},scales:{x:{ticks:{color:'#B4B4C8'},grid:{color:'#28283C'}},y:{ticks:{color:'#B4B4C8'},grid:{color:'#28283C'}}}}});
rankChart=new Chart(document.getElementById('rankChart'),{type:'line',data:{labels:labels,datasets:[{label:'Weekly Rank',data:ranks,tension:.3,borderColor:'#FFC800',backgroundColor:'rgba(255,200,0,.18)',pointBackgroundColor:'#FFC800',pointBorderColor:'#FFC800'}]},options:{responsive:true,plugins:{legend:{labels:{color:'#DCDCDC',font:{family:'Segoe UI'}}}},scales:{x:{ticks:{color:'#B4B4C8'},grid:{color:'#28283C'}},y:{reverse:true,ticks:{color:'#B4B4C8'},grid:{color:'#28283C'}}}}});
}
function renderAllPlayersTable(){
let table=document.getElementById('allPlayersTable');
table.innerHTML='<thead><tr><th>Player</th><th>Overall Total</th><th>Overall Rank</th><th>Weekly Average</th><th>Missed Daily Goals</th><th>Missed Weekly Goals</th></tr></thead><tbody>'+players.map((p,i)=>`<tr onclick="document.getElementById('playerSelect').value='${i}';renderDashboard();" style="cursor:pointer;"><td>${p.name}</td><td>${p.overallTotal}</td><td>${p.overallRank}</td><td>${p.weeklyAverage}</td><td>${p.missedDaily}</td><td>${p.missedWeekly}</td></tr>`).join('')+'</tbody>';
}
function filterAllPlayers(){let q=document.getElementById('searchBox').value.toLowerCase();let rows=document.querySelectorAll('#allPlayersTable tbody tr');rows.forEach(row=>{row.style.display=row.innerText.toLowerCase().includes(q)?'':'none';});}
populateDropdown();
renderAllPlayersView();
</script>
